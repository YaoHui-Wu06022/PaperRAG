[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-rag"
version = "0.1.0"
description = "ArXiv source acquisition for a MinerU-backed MCP RAG knowledge base."
requires-python = ">=3.10"
dependencies = ["fastmcp>=4,<5"]

[project.scripts]
paper-rag = "paper_rag.cli.main:main"
paper-rag-mcp = "paper_rag.mcp.server:main"

[tool.setuptools.packages.find]
include = ["paper_rag*"]

