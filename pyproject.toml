[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-rag"
version = "0.1.0"
description = "Local PDF paper ingestion pipeline for Paper_RAG."
requires-python = ">=3.10"
dependencies = ["pymilvus>=2.6", "mcp>=1.26,<2"]

[project.scripts]
paper-rag = "paper_rag.cli.main:main"
paper-rag-mcp = "paper_rag.mcp.server:main"

[tool.setuptools.packages.find]
include = ["paper_rag*"]
